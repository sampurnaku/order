<style>
:root{--bg:#F1EEEB;--card:#FBFAF9;--ink:#2B2623;--mut:#6E665F;--line:#D8D2CC;--acc:#6B5648;--on:#fff;--ok:#3F6B52;--okbg:#E1EBE3;--wa:#80571A;--wabg:#F3E5C6;--no:#6E665F;--nobg:#E7E3DF;--hi:#8A3A3A;--hibg:#F2DDDA;--sil:#C9C6C3;color-scheme:light dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.by:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.bn{font-size:18px;margin:12px 0 0}.back{margin-top:6px}

.dh{display:flex;align-items:center;gap:10px;margin:6px 0 0;padding:8px 0}

.seg{display:flex;margin:14px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.seg button{flex:1;min-height:44px;border:0;background:none;color:var(--mut);font:inherit;cursor:pointer;padding:0 8px}.seg button+button{border-left:1px solid var(--line)}.seg button[aria-current=true]{background:var(--acc);color:var(--on);font-weight:600}.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:-4px}
.gb{font-size:13px;margin-top:6px;color:var(--mut)}

.kd{font-size:13px;font-weight:600;color:var(--mut);margin-left:8px;white-space:normal}
</style></head><body><div class="wrap">
<h1>Cek Order</h1>
<p class="sub">PDF Instruction Sheet (IS) jadi order, Excel jadi jumlah stock fresh yang sudah didapat.</p>
<div id="msg" role="status"></div>
<section id="p-up">
<div class="seg" role="group" aria-label="Jenis upload"><button data-sub="pdf">Order (PDF)<span id="cpdf"></span></button><button data-sub="xls">Update hasil<span id="cxls"></span></button></div>
<div id="u-pdf">
<div class="bar"><label class="btn p">Tambah order (PDF)<input type="file" id="fpdf" accept="application/pdf,.pdf" multiple hidden></label></div>
<div id="orders"></div>
</div>
<div id="u-xls" hidden>
<div class="bar"><label class="btn p">Update hasil (Excel)<input type="file" id="fxls" accept=".xlsx,.xls" hidden></label></div>
<div id="src"></div>
</div>
<details class="bk"><summary>Cadangan data</summary>
<p class="note">Simpan semua order dan hasil ke satu file untuk pindah HP atau sebagai pengaman. Saat impor, semua data di aplikasi ini diganti dengan isi cadangan, tidak ditambahkan.</p>
<div class="bar"><button class="btn" data-bk="unduh">Unduh cadangan</button><button class="btn" data-bk="salin">Salin sebagai teks</button>
<label class="btn">Pilih file cadangan<input type="file" id="fbk" accept=".json,application/json" hidden></label><button class="btn" data-bk="teks">Impor dari teks</button></div>
<textarea id="tbk" spellcheck="false" placeholder="Teks cadangan muncul di sini. Untuk impor dari teks, tempel isi cadangan lalu tekan Impor dari teks."></textarea></details>
</section>
<div id="sch" hidden><input type="search" id="cari" placeholder="Cari kode, misalnya LCKMJ13I" aria-label="Cari kode"></div>
<section id="p-unk" hidden><div id="unklist"></div></section>
<section id="p-stk" hidden><div id="list"></div></section>
<dialog id="dlg"></dialog>
</div>
<nav class="nav" aria-label="Menu"><button data-tab="up">Upload</button><button data-tab="unk">Belum ada IS<span id="nbadge"></span></button><button data-tab="stk">Data stock fresh</button></nav>
<script>
const KEY='pelacak-order-v1',PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',XLS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const $=s=>document.querySelector(s);
function setSh(){
  document.querySelectorAll('#list .tx').forEach(x=>{x.classList.remove('ov');if(x.scrollWidth>x.clientWidth+1)x.classList.add('ov');});
  document.querySelectorAll('#list details.ord[open][data-oi]').forEach(d=>{const s=d.querySelector('summary');if(s)d.style.setProperty('--sh',s.offsetHeight+'px');});
}
document.addEventListener('toggle',setSh,true);window.addEventListener('resize',setSh);window.addEventListener('load',setSh);
function setTab(t){['up','unk','stk'].forEach(k=>{$('#p-'+k).hidden=k!==t;});$('#sch').hidden=t==='up';$('#cari').placeholder=t==='stk'?'Cari buyer atau kode':'Cari kode, misalnya LCKMJ13I';if($('#cari').value){$('#cari').value='';render();}
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===t)));window.scrollTo(0,0);}
function setSub(k){$('#u-pdf').hidden=k!=='pdf';$('#u-xls').hidden=k!=='xls';document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.sub===k)));}
let D={orders:[],src:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.orders))D=Object.assign(D,s);}catch(e){}
if(!Array.isArray(D.src))D.src=[];
if(D.recv&&D.info&&!D.src.length)D.src=[{id:'s0',file:D.info.file,tgl:D.info.tgl,rows:D.info.rows,unit:'M',recv:D.recv}];
delete D.recv;delete D.info;
const mig=()=>D.orders.forEach(o=>{if(o.closed){o.rows.forEach(r=>{if(!r.closed)r.closed=o.closed;});delete o.closed;}if(o.gab){const a=[];o.gab.forEach(g=>{if(g.s){a.push(g);return;}let l=gabCodes(g.ket||'');if(!l.length&&/^LC[A-Z0-9]{2,}$/.test(g.kode||''))l=[g];l.forEach(x=>{if(!a.some(y=>y.ket===x.ket))a.push(x);});});o.gab=a;}});mig();
const oDone=o=>o.rows.length>0&&o.rows.every(r=>r.closed);
const fmt=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function msg(t,e){const m=$('#msg');m.textContent=t;m.className=e?'err':'';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){msg('Gagal menyimpan: penyimpanan browser penuh atau diblokir. Unduh cadangan dulu.',1);}}
const tglKey=s=>{const m=String(s||'').match(/(\d\d)-(\d\d)-(\d{4})/);return m?+(m[3]+m[2]+m[1]):0;};
/*P*/
const num=v=>typeof v==='number'?v:(parseFloat(String(v==null?'':v).replace(/,/g,''))||0);
function gabCodes(seg){
  const re=/(LC[A-Z0-9]{2,})(?=\s*\/|\s+Q\.\s*\d{4,6})/g,pos=[];let m;
  while((m=re.exec(seg)))pos.push({k:m[1],s:m.index});
  return pos.map((p,i)=>({kode:p.k,ket:seg.slice(p.s,i+1<pos.length?pos[i+1].s:seg.length).replace(/\s+\d{1,2}\.\s*$/,'').trim()})).filter((g,i,a)=>a.findIndex(x=>x.ket===g.ket)===i);
}
function urai(txt){
  const t=txt.replace(/\s+/g,' ');
  const g=re=>{const m=t.match(re);return m?m[1].trim():'';};
  const meta={op:g(/O\.P\s*:\s*(\S+)/),buyer:g(/BUYER\s*:\s*(.+?)\s+CONTRACT NO/),contract:g(/CONTRACT NO\.?\s*:\s*(\S+)/),dest:g(/DESTINATION\s*:\s*(.+?)\s+INDENT NO/),shipment:g(/SHIPMENT\s*:\s*(\d{2}\/\d{2}\/\d{4})/),isNo:g(/DIBUAT OLEH\s+\S+\s+FOLLOW UP\s*:\s*\S+\s+(\d{4,8})/)};
  const tm=t.match(/T\s?O\s?T\s?A\s?L\s+(\d+)\s+([\d.,]+)/);
  const body=tm?t.slice(0,tm.index):t;
  const re=/(KODE\s+|R\/O\s+)?\b((?:[A-Z]{2,}[A-Z0-9]*\d[A-Z0-9]*|LC[A-Z]{2,})(?:\.?\s+[A-Z][A-Z]*(?:\s+[A-Z][A-Z]*)*)?)\s*\/\s*(\d{4,6})\s*-/g,hits=[];let m,cols=0;
  while((m=re.exec(body)))if(!m[1])hits.push({code:m[2].replace(/\s+/g,' ').trim(),mat:m[3],s:m.index,i:m.index+m[0].length});
  const rows=[];
  hits.forEach((h,k)=>{
    const seg=body.slice(h.i,k+1<hits.length?hits[k+1].s:body.length);
    const q=seg.match(/(\d+)\s+([\d.,]+)\s+([\d.,]+)\s*(MTR|YARDS?|YDS?)\b/i);
    if(q&&num(q[3])>0){rows.push({code:h.code,mat:h.mat,qty:num(q[3]),u:/^Y/i.test(q[4])?'Y':'M'});cols+=+q[1];}
  });
  meta.gab=[];const gt=t.slice(tm?tm.index:0),gr=/KIRIM\s+GABUNG|GABUNG\s+KIRIM/gi,ed=/\s+-\s|\s+SHIPPING\s+REMARK|\s+DIBUAT\s+OLEH|\s+NO\.\s*FORM/;let gm;
  while((gm=gr.exec(gt))){const a=gt.slice(0,gm.index),b=Math.max(a.lastIndexOf(' - ')+3,a.search(/REMARK\s*:\s*(?!.*REMARK\s*:)/)>=0?a.search(/REMARK\s*:\s*(?!.*REMARK\s*:)/):0),z=gt.slice(gm.index).search(ed);
    let x=gt.slice(b,z<0?gt.length:gm.index+z).replace(/^[\s-]*(REMARK\s*:)?[\s-]*/i,'').replace(/\s+/g,' ').trim();
    if(x.length>200)x=x.slice(0,200);if(x&&!meta.gab.some(y=>y.ket===x))meta.gab.push({kode:'',ket:x,s:1});gr.lastIndex=gm.index+gm[0].length+(z<0?0:z);}
  meta.rows=rows;meta.cols=cols;meta.tot=tm?{n:+tm[1],q:num(tm[2])}:null;return meta;
}
/*/P*/
const lib={};
const muat=(u,ok)=>lib[u]||(lib[u]=new Promise((res,rej)=>{if(ok())return res();const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>{delete lib[u];rej(new Error('Gagal memuat pustaka pembaca file. Periksa koneksi internet lalu coba lagi.'));};document.head.appendChild(s);}));
/*D*/
function desKolom(it){
  const T=s=>String(s).trim(),out=[];
  it.filter(i=>T(i.s)==='CODE').forEach(c=>{
    const dz=it.find(i=>T(i.s)==='DESIGN'&&Math.abs(i.y-c.y)<4);if(!dz)return;
    const cC=c.x+c.w/2,cD=dz.x+dz.w/2,tot=it.find(i=>i.y<c.y&&i.x<cD&&/^T\s?O\s?T\s?A\s?L\b/.test(T(i.s))),yE=tot?tot.y:-1e9;
    const body=it.filter(i=>i.y<c.y-2&&i.y>yE&&T(i.s));
    const rw=body.filter(i=>i.x<cC&&/^[A-Z][A-Z0-9.]*\d[A-Z0-9]*\s*\//.test(T(i.s))).sort((a,b)=>b.y-a.y);
    const ds=body.filter(i=>i.x>cC&&i.x<=cD);
    rw.forEach((r,k)=>{
      const lo=k+1<rw.length?rw[k+1].y:yE;
      const ln=ds.filter(i=>i.y<=r.y+3&&i.y>lo+2).sort((a,b)=>b.y-a.y||a.x-b.x),keep=[];
      if(ln.length&&Math.abs(ln[0].y-r.y)<=3){let py=ln[0].y;for(const i of ln){if(py-i.y>16)break;keep.push(i);py=i.y;}}
      out.push({code:T(r.s).match(/^[^\s\/]+/)[0],dg:keep.map(i=>T(i.s)).join(' ').replace(/\s+/g,' ').trim()});
    });
  });
  return out;
}
/*/D*/
async function teksPdf(f){
  await muat(PDFJS,()=>window.pdfjsLib);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='',des=[];
  for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();t+=c.items.map(i=>i.str).join(' ')+' ';
    try{des=des.concat(desKolom(c.items.map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}))));}catch(e){}}
  return {t:t,des:des};
}
async function tambahPdf(f){
  const pr=await teksPdf(f),u=urai(pr.t),dus={};
  u.rows.forEach(r=>{const k=pr.des.findIndex((d,j)=>!dus[j]&&d.code===r.code);if(k>=0){dus[k]=1;if(pr.des[k].dg)r.dg=pr.des[k].dg;}});
  if(!u.rows.length)throw new Error(f.name+': tidak ada kode order yang terbaca. Pastikan ini PDF Instruction Sheet.');
  const id=u.op||f.name,i=D.orders.findIndex(o=>o.id===id||(u.isNo&&o.isNo===u.isNo));
  const o={id:id,op:u.op,buyer:u.buyer,contract:u.contract,dest:u.dest,shipment:u.shipment,isNo:u.isNo,gab:u.gab,file:f.name,rows:u.rows};
  if(i>=0){const used={};o.rows.forEach(r=>{const k=D.orders[i].rows.findIndex((x,j)=>x.code===r.code&&x.closed&&!used[j]);if(k>=0){used[k]=1;r.closed=D.orders[i].rows[k].closed;}});D.orders[i]=o;}else D.orders.push(o);
  const q=u.rows.reduce((a,r)=>a+r.qty,0);let w='';
  if(u.tot&&(u.tot.q!==q||u.tot.n!==u.cols))w=' Peringatan: total di PDF '+u.tot.n+' warna, '+fmt(u.tot.q)+', hasil baca '+u.cols+' warna, '+fmt(q)+'. Periksa tabelnya.';
  const gt=u.gab.length?' Ada kirim gabung.':'';
  return {t:'Order '+id+(i>=0?' diperbarui: ':' ditambahkan: ')+u.rows.length+' kode, '+fmt(q)+' m.'+gt+w,w:!!w};

  if((D.orders.length||D.src.length)&&!confirm('Ganti semua data di aplikasi ini ('+D.orders.length+' order, '+D.src.length+' file hasil) dengan isi cadangan ('+o.orders.length+' order, '+sr.length+' file hasil)?')){msg('Dibatalkan. Data tidak berubah.');return;}
  D.orders=o.orders;D.src=sr;
  mig();save();render();msg('Cadangan diimpor: '+o.orders.length+' order.');
}
document.querySelector('details.bk').addEventListener('click',e=>{
  const b=e.target.closest('[data-bk]');if(!b)return;const a=b.dataset.bk,t=$('#tbk');
  if(a==='unduh'){try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([snap()],{type:'application/json'}));l.download='cadangan-cek-order-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();msg('Cadangan diunduh. Kalau tidak ada file yang muncul, pakai Salin sebagai teks.');}catch(x){msg('Unduh gagal. Pakai Salin sebagai teks.',1);}}
  else if(a==='salin'){t.value=snap();t.focus();t.select();const ok=()=>msg('Teks cadangan disalin. Tempel ke catatan atau WhatsApp.');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,()=>msg('Tekan lama pada kotak teks, lalu pilih Salin.'));else msg('Tekan lama pada kotak teks, lalu pilih Salin.');}
  else if(a==='teks')impor(t.value);
});
$('#fbk').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>impor(String(r.result));r.readAsText(f);});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render();setSub('pdf');setTab(D.orders.length||D.src.length?'stk':'up');
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-sub]');if(b)setSub(b.dataset.sub);});
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){if(b.dataset.tab==='stk'&&b.getAttribute('aria-current')==='true'&&buyer){buyer=null;render();}setTab(b.dataset.tab);}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
